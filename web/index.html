<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>minitwitter</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#000; color:#e7e9ea; }
  .hairline { border-color:#2f3336; }
  textarea::placeholder, input::placeholder { color:#71767b; }
  .spin { animation: sp 1s linear infinite; } @keyframes sp { to { transform: rotate(360deg);} }
</style>
</head>
<body class="min-h-screen">
<div class="max-w-xl mx-auto border-x hairline min-h-screen">

  <!-- header -->
  <header class="sticky top-0 z-10 backdrop-blur bg-black/70 border-b hairline px-4 py-3 flex items-center justify-between">
    <h1 class="text-xl font-bold flex items-center gap-2">🐦 <span>minitwitter</span></h1>
    <div class="flex items-center gap-2 text-sm">
      <span class="text-[#71767b]">ты:</span>
      <button id="nickBtn" class="font-semibold text-[#1d9bf0] hover:underline">—</button>
    </div>
  </header>

  <!-- tabs -->
  <nav class="flex border-b hairline text-[15px] font-semibold">
    <button data-tab="home" class="flex-1 py-3.5 hover:bg-white/5 relative">
      Главная
      <span class="tab-underline absolute bottom-0 left-1/2 -translate-x-1/2 h-1 w-14 rounded-full bg-[#1d9bf0]"></span>
    </button>
    <button data-tab="liked" class="flex-1 py-3.5 hover:bg-white/5 relative text-[#71767b]">
      Избранное ❤️
      <span class="tab-underline absolute bottom-0 left-1/2 -translate-x-1/2 h-1 w-14 rounded-full bg-[#1d9bf0] hidden"></span>
    </button>
  </nav>

  <!-- composer -->
  <section class="border-b hairline p-4 flex gap-3">
    <div id="meAvatar" class="w-10 h-10 rounded-full bg-[#1d9bf0] flex items-center justify-center font-bold shrink-0"></div>
    <div class="flex-1">
      <textarea id="composer" rows="2" maxlength="280"
        class="w-full bg-transparent text-lg outline-none resize-none"
        placeholder="Что происходит?!"></textarea>
      <div class="flex items-center justify-between mt-2">
        <span id="counter" class="text-sm text-[#71767b]">280</span>
        <button id="postBtn"
          class="bg-[#1d9bf0] hover:bg-[#1a8cd8] disabled:opacity-50 text-white font-bold px-5 py-1.5 rounded-full">
          Твитнуть
        </button>
      </div>
    </div>
  </section>

  <!-- search / filter -->
  <div class="border-b hairline px-4 py-2 flex items-center gap-2">
    <span class="text-[#71767b]">🔍</span>
    <input id="search" placeholder="Поиск по текст, #тегам, @авторам"
      class="flex-1 bg-transparent outline-none text-sm py-1">
    <button id="clearFilter" class="hidden text-xs text-[#1d9bf0] hover:underline">сбросить</button>
  </div>
  <div id="filterChip" class="hidden border-b hairline px-4 py-2 text-sm text-[#71767b]"></div>

  <!-- feed -->
  <main id="feed"></main>
  <div id="loading" class="p-8 text-center text-[#71767b]">Загрузка…</div>
</div>

<script>
const $ = (s, el=document) => el.querySelector(s);
let NICK = localStorage.getItem("nick") || "";

function ensureNick() {
  if (!NICK) {
    NICK = (prompt("Придумай никнейм:", "guest" + Math.floor(Math.random()*1000)) || "anon").trim().slice(0,30) || "anon";
    localStorage.setItem("nick", NICK);
  }
  $("#nickBtn").textContent = "@" + NICK;
  $("#meAvatar").textContent = NICK.slice(0,1).toUpperCase();
}
$("#nickBtn").onclick = () => {
  const n = (prompt("Сменить никнейм:", NICK) || "").trim().slice(0,30);
  if (n) { NICK = n; localStorage.setItem("nick", n); ensureNick(); load(); }
};

async function api(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: { "Content-Type": "application/json", "X-Nick": NICK },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).error || r.status);
  return r.status === 204 ? null : r.json();
}

function esc(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Turn escaped text into HTML with clickable #hashtags and @mentions.
function linkify(text){
  return esc(text)
    .replace(/(^|\s)#([\p{L}\d_]+)/gu, (m,sp,tag) =>
      `${sp}<a href="#" class="text-[#1d9bf0] hover:underline" data-tag="${tag}">#${tag}</a>`)
    .replace(/(^|\s)@([\p{L}\d_]+)/gu, (m,sp,name) =>
      `${sp}<a href="#" class="text-[#1d9bf0] hover:underline" data-mention="${name}">@${name}</a>`);
}
function avatarColor(name){ let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h},60%,45%)`; }
function timeAgo(iso){
  const s = Math.floor((Date.now() - new Date(iso))/1000);
  if (s<60) return s+"с"; if (s<3600) return Math.floor(s/60)+"м";
  if (s<86400) return Math.floor(s/3600)+"ч"; return Math.floor(s/86400)+"д";
}

const heart = (f) => f
  ? `<svg viewBox="0 0 24 24" class="w-5 h-5 fill-[#f91880]"><path d="M12 21s-7.5-4.6-10-9.2C.5 8.4 2 5 5.4 5c2 0 3.3 1.2 4.6 2.7C11.3 6.2 12.6 5 14.6 5 18 5 19.5 8.4 22 11.8 19.5 16.4 12 21 12 21z"/></svg>`
  : `<svg viewBox="0 0 24 24" class="w-5 h-5 fill-none stroke-current stroke-2"><path d="M12 21s-7.5-4.6-10-9.2C.5 8.4 2 5 5.4 5c2 0 3.3 1.2 4.6 2.7C11.3 6.2 12.6 5 14.6 5 18 5 19.5 8.4 22 11.8 19.5 16.4 12 21 12 21z"/></svg>`;

function postHTML(p) {
  const mine = p.author === NICK;
  return `
  <article class="border-b hairline p-4 flex gap-3" data-id="${p.id}">
    <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold shrink-0"
         style="background:${avatarColor(p.author)}">${esc(p.author.slice(0,1).toUpperCase())}</div>
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-1 text-[15px]">
        <a href="#" class="font-bold hover:underline" data-mention="${esc(p.author)}">@${esc(p.author)}</a>
        <span class="text-[#71767b]">· ${timeAgo(p.created_at)}</span>
        ${p.edited_at ? '<span class="text-[#71767b] text-xs">(ред.)</span>' : ''}
        ${mine ? `<span class="ml-auto flex gap-3 text-[#71767b]">
            <button class="hover:text-[#1d9bf0]" data-act="edit">✏️</button>
            <button class="hover:text-[#f4212e]" data-act="del">🗑️</button>
          </span>` : ''}
      </div>
      <p class="whitespace-pre-wrap break-words mt-0.5" data-role="content">${linkify(p.content)}</p>
      <div class="flex gap-10 mt-3 text-[#71767b] text-sm">
        <button class="flex items-center gap-1 hover:text-[#1d9bf0]" data-act="toggle-comments">
          💬 <span data-role="ccount">${p.comments}</span>
        </button>
        <button class="flex items-center gap-1 ${p.liked?'text-[#f91880]':'hover:text-[#f91880]'}" data-act="like">
          ${heart(p.liked)} <span data-role="lcount">${p.likes}</span>
        </button>
      </div>
      <div data-role="comments" class="hidden mt-3 border-t hairline pt-3 space-y-3"></div>
    </div>
  </article>`;
}

let POSTS = [];
let FILTER = { type: null, value: null }; // type: 'tag' | 'mention' | 'text'
let TAB = "home"; // 'home' | 'liked'

function matchesFilter(p){
  if (TAB === "liked" && !p.liked) return false;
  if (!FILTER.type) return true;
  const c = p.content.toLowerCase();
  if (FILTER.type === "tag")     return new RegExp(`(^|\\s)#${FILTER.value}\\b`,"iu").test(p.content);
  if (FILTER.type === "mention") return p.author.toLowerCase() === FILTER.value.toLowerCase()
                                     || new RegExp(`(^|\\s)@${FILTER.value}\\b`,"iu").test(p.content);
  if (FILTER.type === "text")    return c.includes(FILTER.value) || p.author.toLowerCase().includes(FILTER.value);
  return true;
}

function renderFeed(){
  const shown = POSTS.filter(matchesFilter);
  const empty = TAB === "liked"
    ? "Ты ещё ничего не лайкнул ❤️"
    : "Ничего не найдено";
  $("#feed").innerHTML = shown.length
    ? shown.map(postHTML).join("")
    : `<div class="p-8 text-center text-[#71767b]">${empty}</div>`;

  const chip = $("#filterChip");
  if (FILTER.type) {
    const label = FILTER.type === "tag" ? "#"+FILTER.value
                : FILTER.type === "mention" ? "@"+FILTER.value
                : `«${FILTER.value}»`;
    chip.textContent = `Фильтр: ${label} · ${shown.length} постов`;
    chip.classList.remove("hidden");
    $("#clearFilter").classList.remove("hidden");
  } else {
    chip.classList.add("hidden");
    $("#clearFilter").classList.add("hidden");
  }
}

function setFilter(type, value){
  FILTER = { type, value };
  if (type === "text") $("#search").value = value; else $("#search").value = "";
  renderFeed();
  window.scrollTo({top:0, behavior:"smooth"});
}
function clearFilter(){ FILTER = {type:null,value:null}; $("#search").value=""; renderFeed(); }

async function load() {
  try {
    POSTS = await api("GET", "/api/posts");
    renderFeed();
  } catch(e){ $("#feed").innerHTML = `<div class="p-6 text-center text-[#f4212e]">Ошибка: ${esc(String(e.message))}</div>`; }
  $("#loading").style.display = "none";
}

// Search box -> text filter.
$("#search").addEventListener("input", e => {
  const v = e.target.value.trim().toLowerCase();
  FILTER = v ? {type:"text", value:v} : {type:null,value:null};
  renderFeed();
});
$("#clearFilter").onclick = clearFilter;

// Tabs: home / liked.
document.querySelectorAll("nav [data-tab]").forEach(btn => {
  btn.onclick = () => {
    TAB = btn.dataset.tab;
    document.querySelectorAll("nav [data-tab]").forEach(b => {
      const active = b === btn;
      b.classList.toggle("text-[#71767b]", !active);
      b.querySelector(".tab-underline").classList.toggle("hidden", !active);
    });
    renderFeed();
    window.scrollTo({top:0});
  };
});

// Auto-refresh the feed every 15s, but don't blow away an open filter/compose.
setInterval(async () => {
  if (document.hidden) return;
  // Don't wipe the feed while the user has comments open or is typing a reply.
  if ($('[data-role=comments]:not(.hidden)')) return;
  if (document.activeElement && document.activeElement.tagName === "TEXTAREA"
      && document.activeElement.value) return;
  try { POSTS = await api("GET", "/api/posts"); renderFeed(); } catch(_){}
}, 15000);

// composer
$("#composer").addEventListener("input", e => {
  $("#counter").textContent = 280 - e.target.value.length;
});
$("#postBtn").onclick = async () => {
  const content = $("#composer").value.trim();
  if (!content) return;
  $("#postBtn").disabled = true;
  try { await api("POST", "/api/posts", {content}); $("#composer").value=""; $("#counter").textContent=280; await load(); }
  catch(e){ alert(e.message); }
  $("#postBtn").disabled = false;
};

// event delegation for feed actions
$("#feed").addEventListener("click", async (e) => {
  // Clickable hashtags / mentions.
  const tag = e.target.closest("[data-tag]");
  if (tag) { e.preventDefault(); setFilter("tag", tag.dataset.tag); return; }
  const men = e.target.closest("[data-mention]");
  if (men) { e.preventDefault(); setFilter("mention", men.dataset.mention); return; }

  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const art = e.target.closest("article");
  const id = art.dataset.id;
  const act = btn.dataset.act;

  if (act === "like") {
    try {
      const r = await api("POST", `/api/posts/${id}/like`);
      // Keep local state in sync so the Избранное tab stays correct.
      const p = POSTS.find(p => String(p.id) === id);
      if (p) { p.liked = r.liked; p.likes = r.likes; }
      if (TAB === "liked" && !r.liked) {
        renderFeed(); // unliked post leaves the favourites view
      } else {
        $('[data-role=lcount]', art).textContent = r.likes;
        btn.classList.toggle("text-[#f91880]", r.liked);
        btn.querySelector("svg").outerHTML = heart(r.liked);
      }
    } catch(err){ alert(err.message); }
  }

  if (act === "del") {
    if (!confirm("Удалить пост?")) return;
    try {
      await api("DELETE", `/api/posts/${id}`);
      POSTS = POSTS.filter(p => String(p.id) !== id);
      art.remove();
    } catch(err){ alert(err.message); }
  }

  if (act === "edit") {
    const cur = $('[data-role=content]', art).textContent;
    const next = prompt("Редактировать пост:", cur);
    if (next === null) return;
    const t = next.trim();
    if (!t) return;
    try {
      const updated = await api("PUT", `/api/posts/${id}`, {content: t});
      const p = POSTS.find(p => String(p.id) === id);
      if (p) p.content = updated.content;
      $('[data-role=content]', art).innerHTML = linkify(updated.content);
    } catch(err){ alert(err.message); }
  }

  if (act === "toggle-comments") {
    const box = $('[data-role=comments]', art);
    if (!box.classList.contains("hidden")) { box.classList.add("hidden"); return; }
    box.classList.remove("hidden");
    box.innerHTML = `<div class="text-[#71767b] text-sm">Загрузка…</div>`;
    try {
      const cs = await api("GET", `/api/posts/${id}/comments`);
      box.innerHTML = renderComments(cs) + commentForm();
    } catch(err){ box.innerHTML = `<div class="text-[#f4212e] text-sm">${esc(err.message)}</div>`; }
  }

  if (act === "send-comment") {
    const box = $('[data-role=comments]', art);
    const inp = $('[data-role=cinput]', box);
    const t = inp.value.trim();
    if (!t) return;
    try {
      await api("POST", `/api/posts/${id}/comments`, {content: t});
      const cs = (await api("GET", `/api/posts/${id}/comments`)) || [];
      box.innerHTML = renderComments(cs) + commentForm();
      $('[data-role=ccount]', art).textContent = cs.length;
      $('[data-role=cinput]', box).focus();
    } catch(err){ alert(err.message); }
  }
});

function renderComments(cs){
  cs = cs || [];
  if (!cs.length) return `<div class="text-[#71767b] text-sm">Пока нет комментариев</div>`;
  return cs.map(c => `
    <div class="flex gap-2">
      <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold shrink-0"
           style="background:${avatarColor(c.author)}">${esc(c.author.slice(0,1).toUpperCase())}</div>
      <div class="text-sm"><span class="font-bold">@${esc(c.author)}</span>
        <span class="text-[#71767b]">· ${timeAgo(c.created_at)}</span>
        <p class="whitespace-pre-wrap break-words">${esc(c.content)}</p></div>
    </div>`).join("");
}
function commentForm(){
  return `<div class="flex gap-2 pt-1">
    <input data-role="cinput" maxlength="280" placeholder="Ответить…"
      class="flex-1 bg-transparent border hairline rounded-full px-3 py-1 text-sm outline-none">
    <button data-act="send-comment" class="text-[#1d9bf0] font-semibold text-sm">Отв.</button>
  </div>`;
}

ensureNick();
load();
</script>
</body>
</html>
